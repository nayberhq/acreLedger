name: Extract Census pilot financial records
on:
  push:
    paths:
      - 'ingestion/finance_parse.py'
      - 'ingestion/finance_pilots.py'
      - 'tests/test_finance_parse.py'
      - '.github/workflows/finance-pilots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Extract original Census financial records
        run: python -m ingestion.finance_pilots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-pilot-finance
          path: data/finance-pilots/*.json

name: Extract Census pilot financial records
on:
  push:
    paths:
      - 'ingestion/finance_parse.py'
      - 'ingestion/finance_pilots.py'
      - 'tests/test_finance_parse.py'
      - '.github/workflows/finance-pilots.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Extract original Census financial records
        run: python -m ingestion.finance_pilots
      - name: Validate extraction and report before publishing\n        run: |\n          mkdir -p public/data\n          cp data/finance-pilots/*.json public/data/\n          python tests/validate_site.py\n      - name: Publish source-backed city records for Pages
        run: |
          mkdir -p public/data
          cp data/finance-pilots/*.json public/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "Update original Census finance records"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-pilot-finance
          path: data/finance-pilots/*.json

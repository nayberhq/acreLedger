name: Inspect raw Census finance archives
on:
  push:
    paths:
      - 'ingestion/inspect_finance.py'
      - '.github/workflows/inspect-finance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official Census ZIP layouts
        run: python ingestion/inspect_finance.py
      - uses: actions/upload-artifact@v4
        with:
          name: census-finance-archive-inspection
          path: data/source-inspection/*.json

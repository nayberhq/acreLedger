name: Publish Census national place index
on:
  push:
    paths:
      - 'ingestion/build_places.py'
      - '.github/workflows/places.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m ingestion.build_places
      - name: Commit verified national index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/places.json
          if ! git diff --cached --quiet; then
            git commit -m "Update national Census place index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
